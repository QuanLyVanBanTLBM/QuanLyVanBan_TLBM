name: Signing scheduler

on:
  schedule:
    # Nhắc hạn ký: mỗi giờ (phút 15). Chạy lặp không gửi trùng.
    - cron: "15 * * * *"
    # Gửi lại thông báo Trình ký còn CHO_GUI/THAT_BAI: mỗi 10 phút.
    - cron: "*/10 * * * *"

permissions: {}

concurrency:
  group: signing-scheduler-${{ github.event.schedule }}
  cancel-in-progress: false

jobs:
  run-signing-command:
    name: Run scheduled signing command
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Run management command on the current release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

          case "$SCHEDULE" in
            "15 * * * *") COMMAND=nhac_han_trinh_ky ;;
            "*/10 * * * *") COMMAND=gui_thong_bao_trinh_ky ;;
            *) echo "::error::Unknown schedule"; exit 1 ;;
          esac

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/id_ed25519" -p 2150 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "SIGNING_COMMAND=$COMMAND bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          BASE=/srv/qlvb
          LOG="$BASE/signing-scheduler.log"
          umask 077
          touch "$LOG"
          chmod 600 "$LOG"

          if /usr/bin/flock --wait 1800 "$BASE/.deploy.lock" /bin/bash -c '
            set -euo pipefail
            set -a
            . /etc/qlvb/backend.env
            set +a
            cd /srv/qlvb/current/backend
            exec /srv/qlvb/current/venv/bin/python manage.py "$SIGNING_COMMAND"
          ' >>"$LOG" 2>&1; then
            echo "Signing command $SIGNING_COMMAND completed; details are in the protected server log."
          else
            status=$?
            echo "::error::Signing command $SIGNING_COMMAND failed (exit $status); inspect the protected server log."
            exit "$status"
          fi
          REMOTE_SCRIPT
