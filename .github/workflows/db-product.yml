name: Product DB preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-db-preflight
  cancel-in-progress: false

jobs:
  inspect:
    name: Read-only product DB inspection
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-db
    timeout-minutes: 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: preflight-only-not-for-production
      DJANGO_DEBUG: 'False'
      DB_ENGINE: postgresql
      DB_NAME: qlvb_main
      DB_USER: qlvb_main_migrator
      DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
      DB_HOST: 127.0.0.1
      DB_PORT: '15432'
      PGOPTIONS: '-c default_transaction_read_only=on'
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Open SSH tunnel to the private PostgreSQL port
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DB_PASSWORD"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -N \
            -o ExitOnForwardFailure=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            -p 2150 \
            -L 127.0.0.1:15432:127.0.0.1:15432 \
            "$DEPLOY_USER@$DEPLOY_HOST" &
          echo $! > "$RUNNER_TEMP/product-db-tunnel.pid"

          for attempt in {1..30}; do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/15432' 2>/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/product-db-tunnel.pid")" 2>/dev/null; then
              echo 'SSH tunnel exited before PostgreSQL became reachable.' >&2
              exit 1
            fi
            sleep 1
          done
          echo 'Timed out waiting for the PostgreSQL tunnel.' >&2
          exit 1

      - name: Read database identity and schema counts
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import django

          django.setup()

          from django.db import connection

          expected_database = "qlvb_main"
          expected_user = "qlvb_main_migrator"

          with connection.cursor() as cursor:
              cursor.execute("SHOW default_transaction_read_only")
              read_only = cursor.fetchone()[0]
              if read_only != "on":
                  raise RuntimeError("PostgreSQL session is not read-only; stopping preflight.")

              cursor.execute(
                  "SELECT current_database(), current_user, current_setting('server_version')"
              )
              database, user, version = cursor.fetchone()
              if database != expected_database or user != expected_user:
                  raise RuntimeError(
                      f"Unexpected target: database={database!r}, user={user!r}. "
                      "No database changes were made."
                  )

              cursor.execute(
                  """
                  SELECT
                    (SELECT count(*) FROM information_schema.tables
                     WHERE table_schema = 'public' AND table_type = 'BASE TABLE'),
                    (SELECT count(*) FROM information_schema.views
                     WHERE table_schema = 'public'),
                    (SELECT count(*) FROM pg_type t
                     JOIN pg_namespace n ON n.oid = t.typnamespace
                     WHERE n.nspname = 'public' AND t.typtype = 'e'),
                    (SELECT count(*) FROM pg_trigger t
                     JOIN pg_class c ON c.oid = t.tgrelid
                     JOIN pg_namespace n ON n.oid = c.relnamespace
                     WHERE n.nspname = 'public' AND NOT t.tgisinternal),
                    (SELECT count(*) FROM pg_proc p
                     JOIN pg_namespace n ON n.oid = p.pronamespace
                     WHERE n.nspname = 'public' AND p.prokind = 'f'),
                    to_regclass('public.django_migrations') IS NOT NULL
                  """
              )
              tables, views, enums, triggers, functions, has_history = cursor.fetchone()

              migration_count = None
              if has_history:
                  cursor.execute("SELECT count(*) FROM public.django_migrations")
                  migration_count = cursor.fetchone()[0]

          lines = [
              "## Product DB preflight (read-only inspection)",
              "",
              "No migrations or schema changes were run.",
              "",
              f"- Database: `{database}`",
              f"- Database role: `{user}`",
              f"- PostgreSQL version: `{version}`",
              f"- Read-only session: `{read_only}`",
              f"- Public base tables: `{tables}`",
              f"- Public views: `{views}`",
              f"- Public enum types: `{enums}`",
              f"- Non-internal triggers: `{triggers}`",
              f"- Public functions: `{functions}`",
              f"- `django_migrations` exists: `{has_history}`",
              f"- Recorded Django migrations: `{migration_count if migration_count is not None else 'not available'}`",
              "",
              "A missing `django_migrations` table means the product DB still needs a reviewed migration-baseline step before any migration deployment.",
          ]
          summary = "\n".join(lines) + "\n"
          print(summary)
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary, encoding="utf-8")
          PY

      - name: Close SSH tunnel
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/product-db-tunnel.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/product-db-tunnel.pid")" 2>/dev/null || true
          fi
