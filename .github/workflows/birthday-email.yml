name: Birthday email scheduler

on:
  schedule:
    # 07:07 Asia/Ho_Chi_Minh (UTC+7), offset from the top of the hour.
    - cron: "7 0 * * *"
    # Secondary pass at 07:37; catches a missed primary run when this schedule fires.
    - cron: "37 0 * * *"
  workflow_dispatch:
    inputs:
      username:
        description: "Tài khoản cần gửi bù (để trống để recovery toàn ngày)"
        required: false
        type: string
      date:
        description: "Ngày sinh nhật cần gửi (YYYY-MM-DD)"
        required: true
        type: string

permissions: {}

concurrency:
  group: birthday-email-scheduler
  cancel-in-progress: false

jobs:
  send-birthday-emails:
    if: github.ref == 'refs/heads/staging'
    name: Send scheduled birthday emails
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Run mail task on the current release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          trigger_source=SCHEDULED
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            event_schedule=$(jq -r '.schedule // ""' "$GITHUB_EVENT_PATH")
            if [[ "$event_schedule" == "37 0 * * *" ]]; then
              trigger_source=RECOVERY
            elif [[ "$event_schedule" != "7 0 * * *" ]]; then
              echo "Unsupported birthday email schedule: $event_schedule" >&2
              exit 1
            fi
          fi

          remote_command="bash -s -- '$trigger_source'"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            target_username=$(jq -r '.inputs.username // "" | strings' "$GITHUB_EVENT_PATH")
            target_date=$(jq -er '.inputs.date | strings' "$GITHUB_EVENT_PATH")
            if [[ -n "$target_username" ]]; then
              [[ "$target_username" =~ ^[A-Za-z0-9_.@+-]{1,150}$ ]]
            fi
            [[ "$target_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
            remote_command="bash -s -- 'RECOVERY' '$target_username' '$target_date'"
          fi
          ssh -i "$HOME/.ssh/id_ed25519" -p 2150 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" <<'REMOTE_SCRIPT'
          set -euo pipefail
          BASE=/srv/qlvb
          LOG="$BASE/birthday-email.log"
          umask 077
          touch "$LOG"
          chmod 600 "$LOG"
          trigger_source=${1:-SCHEDULED}
          if [[ "$trigger_source" != SCHEDULED && "$trigger_source" != RECOVERY ]]; then
            echo "Invalid birthday email trigger source." >&2
            exit 2
          fi
          shift || true

          args=("--trigger-source=$trigger_source")
          if (( $# > 0 )); then
            if (( $# != 2 )); then
              echo "Invalid recovery arguments." >&2
              exit 2
            fi
            target_username=$1
            target_date=$2
            args+=("--date=$target_date")
            if [[ -n "$target_username" ]]; then
              args+=("--username=$target_username")
            fi
          fi

          set +e
          /usr/bin/flock --wait 3600 "$BASE/.deploy.lock" /bin/bash -c '
            set -euo pipefail
            set -a
            . /etc/qlvb/backend.env
            set +a
            cd /srv/qlvb/current/backend
            exec /srv/qlvb/current/venv/bin/python manage.py send_birthday_emails "$@"
          ' birthday-email "${args[@]}" 2>&1 | tee -a "$LOG" | awk '/^BIRTHDAY_EMAIL_SUMMARY /'
          pipeline_status=("${PIPESTATUS[@]}")
          status=${pipeline_status[0]}
          if (( status == 0 && (pipeline_status[1] != 0 || pipeline_status[2] != 0) )); then
            status=1
          fi
          set -e

          if (( status == 0 )); then
            echo "Birthday email task completed; details are in the protected server log and application email log."
          else
            echo "::error::Birthday email task failed (exit $status). Check the protected server log; sanitized recipient counts are shown above when available."
            exit "$status"
          fi
          REMOTE_SCRIPT
