[Unit]
Requires=qlvb-backend.socket
After=qlvb-backend.socket

[Service]
# Cong cho: khi deploy.sh dang trong cua so downtime (co file co, het han sau 10 phut),
# service khong duoc khoi dong; socket van giu cong 8001 va xep hang yeu cau.
TimeoutStartSec=660
ExecStartPre=/bin/sh -c 'while [ -e /srv/qlvb/.maintenance ] && [ -z "$(find /srv/qlvb/.maintenance -mmin +10)" ]; do sleep 1; done'
ExecStart=
ExecStart=/srv/qlvb/current/venv/bin/gunicorn config.wsgi:application --workers 2 --timeout 120 --graceful-timeout 30 --access-logfile - --error-logfile -
