# QLVB staging: SPA (/var/www/qlvb) + backend Django qua Gunicorn 127.0.0.1:8001.
# Nguon duy nhat: deploy/nginx/qlvb-frontend.conf trong repo. deploy.sh cai vao
# /etc/nginx/sites-available/qlvb-frontend; khong sua tay tren host.
# Duong vao duy nhat: https://staging-quanlyvanban.bhbl.vn (NAT 443 -> host).
# Chung chi va khoa rieng do don vi van hanh cap tai /etc/qlvb/tls; khong commit vao repo.
upstream qlvb_backend {
    server 127.0.0.1:8001;
    keepalive 16;
}

# Cổng công khai chỉ phục vụ TLS. Nginx dùng mã nội bộ 497 khi nhận HTTP thuần
# trên cổng TLS và chuyển request sang origin HTTPS chính thức.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging-quanlyvanban.bhbl.vn quanlyvanban.duckdns.org 118.69.109.155;

    ssl_certificate /etc/qlvb/tls/fullchain.pem;
    ssl_certificate_key /etc/qlvb/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:QLVBTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    error_page 497 =301 https://staging-quanlyvanban.bhbl.vn$request_uri;

    # Tên miền cũ và truy cập trực tiếp bằng IP chỉ chuyển về origin chính thức.
    if ($host != staging-quanlyvanban.bhbl.vn) {
        return 301 https://staging-quanlyvanban.bhbl.vn$request_uri;
    }

    root /var/www/qlvb;
    index index.html;

    # Ung dung gioi han 20MB moi tep; mot request co the mang nhieu tep.
    client_max_body_size 50m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    # nginx la diem vao dau tien: ghi de header chuyen tiep, khong giu gia tri client gui.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location ^~ /api/ { proxy_pass http://qlvb_backend; }
    location = /api   { proxy_pass http://qlvb_backend; }
    location = /health/ai { proxy_pass http://qlvb_backend; }

    # Admin chi mo qua listener loopback 8089 va SSH tunnel; internet tra 403.
    location ^~ /admin { return 403; }

    location ^~ /static/ { alias /srv/qlvb/current/backend/staticfiles/; expires 7d; access_log off; }
    location ^~ /media/  { return 404; }

    # Birthday cards are standalone HTML and runtime assets; missing files must not fall through to the SPA shell.
    location ^~ /birthday-cards/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        access_log off;

        # .mjs chua co trong /etc/nginx/mime.types mac dinh cua Ubuntu; can gan application/javascript
        # de tranh bi X-Content-Type-Options: nosniff chan khi trinh duyet khoi tao Web Worker (pdf.js).
        location ~* \.mjs$ {
            default_type application/javascript;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header X-Frame-Options "DENY" always;
        }
    }
    location / { try_files $uri $uri/ /index.html; }
}

# Listener loopback riêng cho Django admin qua SSH tunnel. Kênh từ máy dev đến host
# được SSH bảo vệ; X-Forwarded-Proto được đặt cố định để Django không redirect về TLS.
server {
    listen 127.0.0.1:8089;
    server_name 127.0.0.1 localhost;

    server_tokens off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;

    location ^~ /admin {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://qlvb_backend;
    }
    location ^~ /static/ { alias /srv/qlvb/current/backend/staticfiles/; expires 7d; access_log off; }
    location / { return 404; }
}
