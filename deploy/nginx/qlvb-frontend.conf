# QLVB staging: SPA (/var/www/qlvb) + backend Django qua Gunicorn 127.0.0.1:8001.
# Nguon duy nhat: deploy/nginx/qlvb-frontend.conf trong repo. deploy.sh cai vao
# /etc/nginx/sites-available/qlvb-frontend; khong sua tay tren host.
# Duong vao duy nhat: http://quanlyvanban.duckdns.org:8088 (NAT 8088 -> host).
upstream qlvb_backend {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 8088;
    listen [::]:8088;
    server_name quanlyvanban.duckdns.org 118.69.109.155;

    root /var/www/qlvb;
    index index.html;

    # Ung dung gioi han 20MB moi tep; mot request co the mang nhieu tep.
    client_max_body_size 50m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    # nginx la diem vao dau tien: ghi de header chuyen tiep, khong giu gia tri client gui.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location ^~ /api/ { proxy_pass http://qlvb_backend; }
    location = /api   { proxy_pass http://qlvb_backend; }
    location = /health/ai { proxy_pass http://qlvb_backend; }

    # Admin chi mo tu chinh host (SSH tunnel), tu internet tra 403.
    location ^~ /admin {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://qlvb_backend;
    }

    location ^~ /static/ { alias /srv/qlvb/current/backend/staticfiles/; expires 7d; access_log off; }
    location ^~ /media/  { return 404; }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        access_log off;

        # .mjs chua co trong /etc/nginx/mime.types mac dinh cua Ubuntu; can gan application/javascript
        # de tranh bi X-Content-Type-Options: nosniff chan khi trinh duyet khoi tao Web Worker (pdf.js).
        location ~* \.mjs$ {
            default_type application/javascript;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header X-Frame-Options "DENY" always;
        }
    }
    location / { try_files $uri $uri/ /index.html; }
}
